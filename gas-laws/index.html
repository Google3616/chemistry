<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PV=nRT Calculator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #e0e0e0;
            min-height: 100vh;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            background: rgba(30, 30, 46, 0.95);
            border-radius: 20px;
            padding: 40px;
            max-width: 800px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        h1 {
            text-align: center;
            color: #64ffda;
            margin-bottom: 10px;
            font-size: 2.5em;
            text-shadow: 0 0 20px rgba(100, 255, 218, 0.3);
        }

        .equation-display {
            text-align: center;
            font-size: 1.5em;
            color: #bb86fc;
            margin-bottom: 30px;
            padding: 15px;
            background: rgba(187, 134, 252, 0.1);
            border-radius: 10px;
            border: 1px solid rgba(187, 134, 252, 0.3);
        }

        .solve-for {
            margin-bottom: 30px;
        }

        .solve-for label {
            display: block;
            margin-bottom: 10px;
            color: #64ffda;
            font-weight: 600;
        }

        .solve-for select {
            width: 100%;
            padding: 12px;
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(100, 255, 218, 0.3);
            border-radius: 8px;
            color: #e0e0e0;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .solve-for select:focus {
            outline: none;
            border-color: #64ffda;
            box-shadow: 0 0 15px rgba(100, 255, 218, 0.3);
        }

        .input-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 30px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
        }

        .input-group label {
            margin-bottom: 8px;
            color: #bb86fc;
            font-weight: 600;
        }

        .input-row {
            display: flex;
            gap: 10px;
        }

        .input-group input {
            flex: 1;
            padding: 12px;
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(187, 134, 252, 0.3);
            border-radius: 8px;
            color: #e0e0e0;
            font-size: 16px;
            transition: all 0.3s;
        }

        .input-group input:focus {
            outline: none;
            border-color: #bb86fc;
            box-shadow: 0 0 15px rgba(187, 134, 252, 0.3);
        }

        .input-group input:disabled {
            background: rgba(255, 255, 255, 0.02);
            border-color: rgba(187, 134, 252, 0.1);
            cursor: not-allowed;
            opacity: 0.5;
        }

        .input-group select {
            width: 120px;
            padding: 12px;
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(187, 134, 252, 0.3);
            border-radius: 8px;
            color: #e0e0e0;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .input-group select:focus {
            outline: none;
            border-color: #bb86fc;
        }

        .calculate-btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #64ffda 0%, #00bfa5 100%);
            border: none;
            border-radius: 10px;
            color: #1a1a2e;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            margin-bottom: 20px;
            box-shadow: 0 5px 20px rgba(100, 255, 218, 0.3);
        }

        .calculate-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(100, 255, 218, 0.5);
        }

        .calculate-btn:active {
            transform: translateY(0);
        }

        .result {
            background: rgba(100, 255, 218, 0.1);
            border: 2px solid rgba(100, 255, 218, 0.3);
            border-radius: 10px;
            padding: 20px;
            text-align: center;
            min-height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
        }

        .result-label {
            color: #64ffda;
            font-size: 14px;
            margin-bottom: 10px;
        }

        .result-value {
            color: #fff;
            font-size: 24px;
            font-weight: bold;
        }

        .error {
            color: #ff6b6b;
        }

        .formula-explanation {
            margin-top: 30px;
            padding: 20px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .formula-explanation h3 {
            color: #64ffda;
            margin-bottom: 15px;
        }

        .formula-explanation p {
            color: #b0b0b0;
            line-height: 1.6;
            margin-bottom: 10px;
        }

        @media (max-width: 768px) {
            .input-grid {
                grid-template-columns: 1fr;
            }

            .container {
                padding: 20px;
            }

            h1 {
                font-size: 2em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>PV = nRT Calculator</h1>
        <div class="equation-display" id="equationDisplay">PV = nRT</div>

        <div class="solve-for">
            <label>Solve for:</label>
            <select id="solveFor" onchange="updateInputs()">
                <option value="P">Pressure (P)</option>
                <option value="V">Volume (V)</option>
                <option value="n">Moles (n)</option>
                <option value="T">Temperature (T)</option>
            </select>
        </div>

        <div class="input-grid">
            <div class="input-group" id="pressureGroup">
                <label>Pressure (P)</label>
                <div class="input-row">
                    <input type="number" id="pressure" step="any" placeholder="Enter value">
                    <select id="pressureUnit">
                        <option value="atm">atm</option>
                        <option value="Pa">Pa</option>
                        <option value="kPa">kPa</option>
                        <option value="bar">bar</option>
                        <option value="mmHg">mmHg</option>
                        <option value="psi">psi</option>
                    </select>
                </div>
            </div>

            <div class="input-group" id="volumeGroup">
                <label>Volume (V)</label>
                <div class="input-row">
                    <input type="number" id="volume" step="any" placeholder="Enter value">
                    <select id="volumeUnit">
                        <option value="L">L</option>
                        <option value="mL">mL</option>
                        <option value="m3">m³</option>
                        <option value="cm3">cm³</option>
                        <option value="gal">gal</option>
                    </select>
                </div>
            </div>

            <div class="input-group" id="molesGroup">
                <label>Moles (n)</label>
                <div class="input-row">
                    <input type="number" id="moles" step="any" placeholder="Enter value">
                    <select id="molesUnit">
                        <option value="mol">mol</option>
                        <option value="mmol">mmol</option>
                        <option value="kmol">kmol</option>
                    </select>
                </div>
            </div>

            <div class="input-group" id="temperatureGroup">
                <label>Temperature (T)</label>
                <div class="input-row">
                    <input type="number" id="temperature" step="any" placeholder="Enter value">
                    <select id="temperatureUnit">
                        <option value="K">K</option>
                        <option value="C">°C</option>
                        <option value="F">°F</option>
                    </select>
                </div>
            </div>
        </div>

        <button class="calculate-btn" onclick="calculate()">Calculate</button>

        <div class="result" id="result">
            <div class="result-label">Result will appear here</div>
        </div>

        <div class="formula-explanation">
            <h3>About the Ideal Gas Law</h3>
            <p><strong>PV = nRT</strong> is the ideal gas law equation where:</p>
            <p><strong>P</strong> = Pressure of the gas</p>
            <p><strong>V</strong> = Volume of the gas</p>
            <p><strong>n</strong> = Number of moles</p>
            <p><strong>R</strong> = Universal gas constant (0.08206 L·atm/mol·K)</p>
            <p><strong>T</strong> = Temperature in Kelvin</p>
        </div>
    </div>

    <script>
        const R = 0.08206; // L·atm/(mol·K)

        function updateInputs() {
            const solveFor = document.getElementById('solveFor').value;
            const inputs = ['pressure', 'volume', 'moles', 'temperature'];
            
            inputs.forEach(input => {
                const element = document.getElementById(input);
                if (input.charAt(0).toUpperCase() === solveFor || 
                    (input === 'pressure' && solveFor === 'P') ||
                    (input === 'volume' && solveFor === 'V') ||
                    (input === 'moles' && solveFor === 'n') ||
                    (input === 'temperature' && solveFor === 'T')) {
                    element.disabled = true;
                    element.value = '';
                } else {
                    element.disabled = false;
                }
            });

            updateEquationDisplay();
        }

        function updateEquationDisplay() {
            const solveFor = document.getElementById('solveFor').value;
            const equations = {
                'P': 'P = nRT / V',
                'V': 'V = nRT / P',
                'n': 'n = PV / RT',
                'T': 'T = PV / nR'
            };
            document.getElementById('equationDisplay').textContent = equations[solveFor];
        }

        function convertToStandardUnits(value, unit, type) {
            const conversions = {
                pressure: {
                    'atm': 1,
                    'Pa': 1/101325,
                    'kPa': 1/101.325,
                    'bar': 0.986923,
                    'mmHg': 1/760,
                    'psi': 1/14.696
                },
                volume: {
                    'L': 1,
                    'mL': 0.001,
                    'm3': 1000,
                    'cm3': 0.001,
                    'gal': 3.78541
                },
                moles: {
                    'mol': 1,
                    'mmol': 0.001,
                    'kmol': 1000
                },
                temperature: {
                    'K': (v) => v,
                    'C': (v) => v + 273.15,
                    'F': (v) => (v - 32) * 5/9 + 273.15
                }
            };

            if (type === 'temperature') {
                return conversions[type][unit](value);
            }
            return value * conversions[type][unit];
        }

        function convertFromStandardUnits(value, unit, type) {
            const conversions = {
                pressure: {
                    'atm': 1,
                    'Pa': 101325,
                    'kPa': 101.325,
                    'bar': 1.01325,
                    'mmHg': 760,
                    'psi': 14.696
                },
                volume: {
                    'L': 1,
                    'mL': 1000,
                    'm3': 0.001,
                    'cm3': 1000,
                    'gal': 0.264172
                },
                moles: {
                    'mol': 1,
                    'mmol': 1000,
                    'kmol': 0.001
                },
                temperature: {
                    'K': (v) => v,
                    'C': (v) => v - 273.15,
                    'F': (v) => (v - 273.15) * 9/5 + 32
                }
            };

            if (type === 'temperature') {
                return conversions[type][unit](value);
            }
            return value * conversions[type][unit];
        }

        function calculate() {
            const solveFor = document.getElementById('solveFor').value;
            const resultDiv = document.getElementById('result');

            try {
                // Get values and convert to standard units
                const P = document.getElementById('pressure').value ? 
                    convertToStandardUnits(parseFloat(document.getElementById('pressure').value), 
                    document.getElementById('pressureUnit').value, 'pressure') : null;
                
                const V = document.getElementById('volume').value ? 
                    convertToStandardUnits(parseFloat(document.getElementById('volume').value), 
                    document.getElementById('volumeUnit').value, 'volume') : null;
                
                const n = document.getElementById('moles').value ? 
                    convertToStandardUnits(parseFloat(document.getElementById('moles').value), 
                    document.getElementById('molesUnit').value, 'moles') : null;
                
                const T = document.getElementById('temperature').value ? 
                    convertToStandardUnits(parseFloat(document.getElementById('temperature').value), 
                    document.getElementById('temperatureUnit').value, 'temperature') : null;

                let result;
                let resultUnit;
                let resultType;

                switch(solveFor) {
                    case 'P':
                        if (!n || !T || !V) throw new Error('Please fill in all required fields');
                        result = (n * R * T) / V;
                        resultUnit = document.getElementById('pressureUnit').value;
                        resultType = 'pressure';
                        break;
                    case 'V':
                        if (!n || !T || !P) throw new Error('Please fill in all required fields');
                        result = (n * R * T) / P;
                        resultUnit = document.getElementById('volumeUnit').value;
                        resultType = 'volume';
                        break;
                    case 'n':
                        if (!P || !V || !T) throw new Error('Please fill in all required fields');
                        result = (P * V) / (R * T);
                        resultUnit = document.getElementById('molesUnit').value;
                        resultType = 'moles';
                        break;
                    case 'T':
                        if (!P || !V || !n) throw new Error('Please fill in all required fields');
                        result = (P * V) / (n * R);
                        resultUnit = document.getElementById('temperatureUnit').value;
                        resultType = 'temperature';
                        break;
                }

                const convertedResult = convertFromStandardUnits(result, resultUnit, resultType);
                
                resultDiv.innerHTML = `
                    <div class="result-label">${solveFor === 'P' ? 'Pressure' : solveFor === 'V' ? 'Volume' : solveFor === 'n' ? 'Moles' : 'Temperature'}</div>
                    <div class="result-value">${convertedResult.toFixed(4)} ${resultUnit}</div>
                `;
            } catch (error) {
                resultDiv.innerHTML = `
                    <div class="result-value error">${error.message}</div>
                `;
            }
        }

        // Initialize
        updateInputs();
    </script>
</body>
</html>
